<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결혼식 뒷풀이 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');
        body { font-family: "Pretendard", sans-serif; }
        .font-serif { font-family: "Gowun Batang", serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#FDFBF7] text-gray-800 pb-20">

    <header class="relative h-80 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=2070&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover object-center scale-105" alt="웨딩 배경">
        
        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>

        <div class="relative z-10 flex flex-col items-center justify-center h-full text-white text-center px-6">
            <p class="text-xs uppercase tracking-[0.3em] text-white/80 mb-5">Thank You For Coming</p>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold mb-4 drop-shadow-sm">철수 & 영희의<br>추천 맛집 리스트</h1>
            <p class="text-sm sm:text-base text-white/90 max-w-md leading-relaxed font-light opacity-90">
                귀한 발걸음 해주셔서 진심으로 감사합니다.<br>
                식사 후 가볍게 들르실 수 있는 주변 곳들을 모았습니다.
            </p>
            <div class="mt-6 text-white/50">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mx-auto">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3" />
                </svg>
            </div>
        </div>
    </header>
    <nav class="sticky top-0 z-40 bg-[#FDFBF7]/95 backdrop-blur-sm py-4 border-b border-gray-200 mb-8 mt-[-20px] rounded-t-3xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <div class="flex justify-center gap-2 px-4 overflow-x-auto scrollbar-hide">
            <button onclick="filterCards('all', this)" class="filter-btn px-4 py-1.5 bg-gray-900 text-white rounded-full text-xs font-medium shadow-md whitespace-nowrap transition-all">전체보기</button>
            <button onclick="filterCards('food', this)" class="filter-btn px-4 py-1.5 bg-white text-gray-600 border border-gray-300 rounded-full text-xs font-medium whitespace-nowrap transition-all">🍽️ 맛집</button>
            <button onclick="filterCards('cafe', this)" class="filter-btn px-4 py-1.5 bg-white text-gray-600 border border-gray-300 rounded-full text-xs font-medium whitespace-nowrap transition-all">☕ 카페</button>
            <button onclick="filterCards('pub', this)" class="filter-btn px-4 py-1.5 bg-white text-gray-600 border border-gray-300 rounded-full text-xs font-medium whitespace-nowrap transition-all">🍺 뒷풀이</button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4">
        <div class="grid grid-cols-2 gap-3" id="card-container"></div>
    </main>

    <footer class="fixed bottom-0 w-full bg-white border-t border-gray-200 py-4 px-6 text-center z-50">
        <p class="text-xs text-gray-400">행복하게 잘 살겠습니다!</p>
    </footer>

    <script>
        // ============================================================
        // [1] 순천 파티움하우스 결혼식 하객용 맛집 데이터
        // ============================================================
        const placeData = [
            // ---------------- [맛집: 꼬막/한정식] ----------------
            {

            },
            {

                mapUrl: "https://naver.me/5pswlFfL",
                tel: "0617452100"
            },
            {
                category: "food",
                name: "밥꽃이야기 들마루",

                distance: "🚗 차로 18분",
                tag: "🌸 분위기 맛집",
                comment: "깔끔하고 정갈한 한상차림을 원하신다면 이곳을 추천해요. 어른들 모시기 좋습니다.",
                mapUrl: "https://naver.me/FfMWw5w5",
                tel: "0617415233"
            },
            {
                category: "food",
                name: "나눌터",
                subTitle: "도토리 요리 전문",
                image: "https://images.unsplash.com/photo-1604153927653-53cb7a83d312?q=80&w=600&auto=format&fit=crop",
                distance: "🚗 차로 10분",
                tag: "🌰 이색 건강식",
                comment: "속이 편안한 도토리 임자탕이 별미입니다. 웨이팅이 있을 수 있으니 서두르세요!",
                mapUrl: "https://naver.me/xYQmqmXq",
                tel: "0617260536"
            },

            // ---------------- [맛집: 국밥/통닭/기타] ----------------
            {
                category: "food",
                name: "건봉국밥",
                subTitle: "순천 대표 국밥",
                image: "https://images.unsplash.com/photo-1579830341088-7278216d2528?q=80&w=600&auto=format&fit=crop",

                tag: "🏆 전국구 맛집",
                comment: "아랫장에 위치한 전설의 국밥집! 국물이 진하고 수육이 정말 부드러워요.",
                mapUrl: "https://naver.me/5PSjKjR7",
                tel: "0617520900"
            },
            {
                category: "food",
                name: "거목순대국밥",

                image: "https://images.unsplash.com/photo-1563897539633-7374c276c212?q=80&w=600&auto=format&fit=crop",

                tag: "🌿 막창순대",
                comment: "윗장에 위치했어요. 콩나물이 들어가 시원한 국물과 쫄깃한 막창순대가 일품!",
                mapUrl: "https://naver.me/5SWqSjRj",
                tel: "0617417880"
            },
            {
                category: "food",
                name: "풍미통닭",
                subTitle: "마늘통닭",
                image: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?q=80&w=600&auto=format&fit=crop",
                distance: "🚗 차로 7분",
                tag: "🧄 마늘향 가득",
                comment: "40년 전통의 시골 통닭! 알싸한 마늘 소스가 치킨의 느끼함을 싹 잡아줍니다.",
                mapUrl: "https://naver.me/xRPEPEPE", 
                tel: "0617447041"
            },
            {
                category: "food",
                name: "다락카레",
                subTitle: "일본식 카레",
                image: "https://images.unsplash.com/photo-1574484284002-952d92456975?q=80&w=600&auto=format&fit=crop",
                distance: "🚗 차로 15분",
                tag: "🍛 호수공원 근처",
                comment: "조례 호수공원 산책하고 가기 좋아요. 카레가 부드럽고 토핑이 다양합니다.",
                mapUrl: "https://naver.me/5SWqSjRj", 
                tel: "0617250221"
            },
            {
                category: "food",
                name: "힉 (Hic)",
                subTitle: "화덕피자 & 파스타",

                tag: "🍕 신대지구 핫플",
                comment: "젊은 하객분들께 추천! 분위기 좋은 곳에서 양식을 즐기고 싶다면 여기로.",
                mapUrl: "https://naver.me/example", 
                tel: "050713300000"
            },

            // ---------------- [카페: 베이커리/디저트] ----------------
            {
                category: "cafe",
                name: "우즈베이커리",
                subTitle: "대형 베이커리 카페",
                image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=600&auto=format&fit=crop",
                distance: "🚗 차로 10분",
                tag: "🅿️ 주차장 넓음",
                comment: "동천 옆에 있는 엄청 큰 카페예요. 빵 종류도 많고 좌석이 넓어서 뒷풀이 수다 떨기 딱!",
                mapUrl: "https://naver.me/example",
                tel: "0617220000"
            },
            // (카페 목록에 '밀림슈퍼'나 '브루웍스'도 추가하시면 좋습니다!)

            // ---------------- [뒷풀이: 술집] ----------------
            {
                category: "pub",
                name: "서식",
                subTitle: "한식 요리주점",
                image: "https://images.unsplash.com/photo-1536935338788-843bb6d8d175?q=80&w=600&auto=format&fit=crop",
                distance: "🚗 차로 15분",
                tag: "🍶 안주 맛집",
                comment: "조례동 술집 거리에 있어요. 수육이랑 전골이 맛있어서 술이 술술 들어갑니다.",
                mapUrl: "https://naver.me/example", 
                tel: "050713000000"
            }
        ];

        // ============================================================
        // [2] 화면 그리기 기능 (수정 X)
        // ============================================================
        const container = document.getElementById('card-container');
        
        function renderCards() {
            container.innerHTML = "";
            placeData.forEach(place => {
                let linkAction = "";
                // 링크가 없으면 알림창, 있으면 새창 열기
                if (!place.mapUrl || place.mapUrl === "" || place.mapUrl === "#") {
                    linkAction = `href="javascript:void(0);" onclick="alert('지도 링크를 준비 중입니다!')"`;
                } else {
                    linkAction = `href="${place.mapUrl}" target="_blank"`;
                }

                const cardHTML = `
                    <div class="place-card bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col h-full" data-category="${place.category}">
                        <div class="relative h-36 bg-gray-200">
                            <img src="${place.image}" class="w-full h-full object-cover">
                            <div class="absolute bottom-2 left-2 flex flex-wrap gap-1">
                                <span class="bg-black/70 backdrop-blur-sm text-white px-1.5 py-0.5 rounded text-[10px] font-bold">${place.distance}</span>
                                <span class="bg-blue-600/80 backdrop-blur-sm text-white px-1.5 py-0.5 rounded text-[10px] font-bold">${place.tag}</span>
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="text-sm font-bold text-gray-900 truncate pr-1">${place.name}</h3>
                                    <span class="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded flex-shrink-0">${place.subTitle}</span>
                                </div>
                                <div class="bg-[#FAF7F2] p-2 rounded-md mb-2">
                                    <p class="text-[11px] text-gray-600 leading-tight line-clamp-2">"${place.comment}"</p>
                                </div>
                            </div>
                            <div class="flex gap-1 mt-auto">
                                <a ${linkAction} class="flex-1 bg-yellow-400 py-1.5 rounded-md text-[11px] font-bold text-gray-900 hover:bg-yellow-500 flex items-center justify-center cursor-pointer">
                                    길찾기
                                </a>
                                <a href="tel:${place.tel}" class="w-7 h-7 bg-gray-100 rounded-md flex items-center justify-center text-gray-600">📞</a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // [3] 필터링 기능 (수정 X)
        function filterCards(category, btnElement) {
            const cards = document.querySelectorAll('.place-card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.className = "filter-btn px-4 py-1.5 bg-white text-gray-600 border border-gray-300 rounded-full text-xs font-medium whitespace-nowrap cursor-pointer hover:bg-gray-50 transition-all";
            });
            btnElement.className = "filter-btn px-4 py-1.5 bg-gray-900 text-white rounded-full text-xs font-medium shadow-md whitespace-nowrap cursor-pointer transition-all transform scale-105";
        }

        // 실행
        renderCards();
    </script>
</body>
</html>
