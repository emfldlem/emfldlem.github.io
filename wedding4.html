        // ============================================================
        // [2] 자동 정렬 기능 (가까운 순서로)
        // ============================================================
        placeData.sort((a, b) => {
            const timeA = parseInt(a.distance.replace(/[^0-9]/g, "")) || 0;
            const timeB = parseInt(b.distance.replace(/[^0-9]/g, "")) || 0;
            return timeA - timeB;
        });

        // ============================================================
        // [3] 화면 그리기 기능 (주차 배지 포함)
        // ============================================================
        const container = document.getElementById('card-container');
        
        function renderCards() {
            container.innerHTML = "";
            placeData.forEach(place => {
                let linkAction = "";
                if (!place.mapUrl || place.mapUrl === "" || place.mapUrl === "#") {
                    linkAction = `href="javascript:void(0);" onclick="alert('지도 링크를 준비 중입니다!')"`;
                } else {
                    linkAction = `href="${place.mapUrl}" target="_blank"`;
                }

                const parkingBadge = place.parking 
                    ? `<span class="bg-gray-800/80 backdrop-blur-sm text-white px-1.5 py-0.5 rounded text-[10px] font-bold flex items-center">🅿️ 주차가능</span>` 
                    : "";

                const cardHTML = `
                    <div class="place-card bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col h-full" data-category="${place.category}">
                        <div class="relative h-36 bg-gray-200">
                            <img src="${place.image}" class="w-full h-full object-cover">
                            <div class="absolute bottom-2 left-2 flex flex-wrap gap-1">
                                <span class="bg-black/70 backdrop-blur-sm text-white px-1.5 py-0.5 rounded text-[10px] font-bold">${place.distance}</span>
                                <span class="bg-blue-600/80 backdrop-blur-sm text-white px-1.5 py-0.5 rounded text-[10px] font-bold">${place.tag}</span>
                                ${parkingBadge}
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="text-sm font-bold text-gray-900 truncate pr-1">${place.name}</h3>
                                    <span class="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded flex-shrink-0">${place.subTitle}</span>
                                </div>
                                <div class="bg-[#FAF7F2] p-2 rounded-md mb-2">
                                    <p class="text-[11px] text-gray-600 leading-tight line-clamp-2">"${place.comment}"</p>
                                </div>
                            </div>
                            <div class="flex gap-1 mt-auto">
                                <a ${linkAction} class="flex-1 bg-yellow-400 py-1.5 rounded-md text-[11px] font-bold text-gray-900 hover:bg-yellow-500 flex items-center justify-center cursor-pointer">
                                    길찾기
                                </a>
                                <a href="tel:${place.tel}" class="w-7 h-7 bg-gray-100 rounded-md flex items-center justify-center text-gray-600">📞</a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // ============================================================
        // [4] 필터링 기능
        // ============================================================
        function filterCards(category, btnElement) {
            const cards = document.querySelectorAll('.place-card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                // 일반 버튼 스타일
                btn.className = "filter-btn px-4 py-1.5 bg-white text-gray-600 border border-gray-300 rounded-full text-xs font-medium whitespace-nowrap cursor-pointer hover:bg-gray-50 transition-all";
                // 여수 버튼만 파란색 글씨 유지
                if(btn.innerText.includes("여수")) {
                    btn.classList.add("text-blue-600", "border-blue-200");
                }
            });
            // 클릭된 버튼 스타일
            btnElement.className = "filter-btn px-4 py-1.5 bg-gray-900 text-white rounded-full text-xs font-medium shadow-md whitespace-nowrap cursor-pointer transition-all transform scale-105";
        }

        renderCards();

    </script>
