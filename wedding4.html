<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S & H Wedding Guide</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <link rel="stylesheet" href="css/style_wedding.css">

    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=bv903cidxx"></script>
</head>
<body>

    <header id="header">
        <div class="logo">S <span>&</span> H Wedding</div>
        <div style="font-size: 0.8em; font-weight: 600;">순천 가이드</div>
    </header>

    <div id="wrapper">
        <section class="hero">
            <span class="icon-symbol">❤</span>
            <h1>순천, 맛과 멋을 담다</h1>
            <p>
                먼 길 와주신 하객 여러분 감사합니다.<br>
                파티움하우스 주변과 순천의 찐 맛집을 소개합니다.
            </p>
        </section>

        <section class="map-section">
            <div id="map-container">
                <div id="map"></div>
            </div>
            <div style="text-align:center; margin-top:1em; font-size:0.9em; color:#888;">
                👆 지도의 핀을 클릭하거나 아래 리스트를 눌러보세요.
            </div>
        </section>

        <div class="filters">
            <button class="filter-btn active" onclick="filterData('all')">전체보기</button>
            <button class="filter-btn" onclick="filterData('meal')">🍚 맛집</button>
            <button class="filter-btn" onclick="filterData('cafe')">☕ 카페</button>
            <button class="filter-btn" onclick="filterData('gift')">🎁 선물</button>
        </div>

        <div class="tiles" id="tiles-container"></div>
    </div>

    <footer id="footer">
        <p>행복하게 잘 살겠습니다.<br>2025.12.14 신랑 OOO & 신부 OOO</p>
    </footer>

    <script src="js/script_wedding.js"></script>
</body>
</html>
